<script type="module">
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const bus = new BroadcastChannel('webrtc-neural-signaling');
    let pc = null;
    let channel = null;
    let astBuffer = '';

    function renderScreen(text) {
      ctx.fillStyle = '#050a05';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66';
      ctx.font = '20px monospace';
      
      const lines = text.split('\n');
      lines.forEach((line, idx) => {
        ctx.fillText(line, 40, 60 + (idx * 28));
      });
    }

    renderScreen('> LISP-RT HYPERVISOR v1.0.0\n> AWAITING NEURAL BUS LINK...');

    // 1. Announce presence to worker.html on an interval until connected
    const connectInterval = setInterval(() => {
      if (!channel || channel.readyState !== 'open') {
        bus.postMessage({ type: 'peer_ready' });
      } else {
        clearInterval(connectInterval);
      }
    }, 600);

    // 2. Handle Signaling Messages
    bus.onmessage = async (e) => {
      if (e.data.type === 'offer') {
        // Clean up previous peer connection if one exists
        if (pc) {
          pc.close();
        }

        pc = new RTCPeerConnection();

        pc.ondatachannel = (ev) => {
          channel = ev.channel;
          channel.onopen = () => {
            clearInterval(connectInterval);
            status.textContent = '[NEURAL BUS CONNECTED]';
            status.style.color = '#00ff41';
          };
          channel.onclose = () => {
            status.textContent = '[BUS DISCONNECTED]';
            status.style.color = '#888';
          };
          channel.onmessage = (msg) => {
            if (msg.data === '__EOF__') {
              astBuffer += '\n\n; --- AST COMPILED & EVALUATED ---';
            } else {
              astBuffer += msg.data;
            }
            renderScreen(`> INCOMING S-EXPRESSION STREAM:\n\n${astBuffer}`);
          };
        };

        pc.onicecandidate = (ev) => {
          if (ev.candidate) {
            bus.postMessage({ type: 'candidate', candidate: ev.candidate });
          }
        };

        try {
          await pc.setRemoteDescription(new RTCSessionDescription(e.data.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          bus.postMessage({ type: 'answer', sdp: pc.localDescription });
        } catch (err) {
          console.warn('[Hypervisor] Signaling error:', err);
        }

      } else if (e.data.type === 'candidate' && pc) {
        try {
          if (pc.remoteDescription) {
            await pc.addIceCandidate(new RTCIceCandidate(e.data.candidate));
          }
        } catch (err) {
          console.warn('[Hypervisor] ICE error:', err);
        }
      }
    };

    document.getElementById('btn-dispatch').onclick = () => {
      if (!channel || channel.readyState !== 'open') return;
      astBuffer = '';
      renderScreen('> DISPATCHING INTENT TO SILICON...');
      channel.send('Generate a short quadratic equation practice quiz node.');
    };
  </script>
