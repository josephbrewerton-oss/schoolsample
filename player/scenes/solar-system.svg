<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sun-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background space grid -->
  <rect x="0" y="0" width="800" height="480" fill="#030712" />
  <!-- Central Sun -->
  <circle id="sun-corona" cx="400" cy="240" r="38" fill="url(#sun-rad)" opacity="0.4" filter="url(#glow)" />
  <circle id="sun-body" cx="400" cy="240" r="26" fill="url(#sun-rad)" />
  <!-- Dynamic 3D Planetary Orbits -->
  <path id="orbit-mercury" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="orbit-venus" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="orbit-earth" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="orbit-mars" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="orbit-jupiter" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="orbit-saturn" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <!-- Planets -->
  <circle id="planet-mercury" cx="465" cy="240" r="5" fill="#94a3b8" />
  <text id="label-mercury" x="465" y="258" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Mercury</text>
  <circle id="planet-venus" cx="505" cy="240" r="8" fill="#fde047" />
  <text id="label-venus" x="505" y="261" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Venus</text>
  <circle id="planet-earth" cx="555" cy="240" r="9" fill="#38bdf8" />
  <text id="label-earth" x="555" y="262" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Earth</text>
  <circle id="moon-earth" cx="573" cy="240" r="2.5" fill="#f8fafc" />
  <circle id="planet-mars" cx="605" cy="240" r="6" fill="#ef4444" />
  <text id="label-mars" x="605" y="259" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Mars</text>
  <circle id="planet-jupiter" cx="660" cy="240" r="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
  <text id="label-jupiter" x="660" y="266" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Jupiter</text>
  <path id="saturn-ring" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.85" />
  <circle id="planet-saturn" cx="720" cy="240" r="11" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />
  <text id="label-saturn" x="720" y="264" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Saturn</text>
</svg>
