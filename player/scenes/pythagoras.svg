<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <polygon points="360,280 480,280 360,190" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <rect x="360" y="264" width="16" height="16" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  <rect id="pyth-rect-b" x="360" y="280" width="120" height="0" fill="#3b82f6" fill-opacity="0.6" stroke="#60a5fa" stroke-width="2" />
  <text id="pyth-txt-b" x="420" y="340" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" opacity="0">b² = 16</text>
  <rect id="pyth-rect-a" x="360" y="190" width="0" height="90" fill="#10b981" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
  <text id="pyth-txt-a" x="315" y="235" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" opacity="0">a² = 9</text>
  <rect x="230" y="24" width="340" height="40" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="400" y="49" fill="#f59e0b" font-size="18" font-weight="bold" text-anchor="middle">3² + 4² = 5² ➔ 9 + 16 = 25</text>
</svg>
