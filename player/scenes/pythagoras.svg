<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="pyth-bg-glow" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Side a (Emerald) Gradient -->
    <linearGradient id="pyth-grad-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.7" />
    </linearGradient>

    <!-- Side b (Sapphire) Gradient -->
    <linearGradient id="pyth-grad-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Hypotenuse c (Gold Amber) Gradient -->
    <linearGradient id="pyth-grad-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pyth-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="pyth-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Ambient Backdrop & Geometry Grid -->
  <rect width="800" height="480" fill="url(#pyth-bg-glow)" />
  <rect width="800" height="480" fill="url(#pyth-grid)" />

  <!-- Top Glassmorphic Equation Banner -->
  <g transform="translate(180, 20)">
    <rect width="440" height="44" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <text x="220" y="28" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" font-family="sans-serif">
      <tspan fill="#34d399">a² (9)</tspan> + <tspan fill="#60a5fa">b² (16)</tspan> = <tspan fill="#fbbf24">c² (25)</tspan> ➔ 3² + 4² = 5²
    </text>
  </g>

  <!-- Side a Square (3 x 3 = 9 units) -->
  <g id="pyth-group-a">
    <rect id="pyth-rect-a" x="360" y="190" width="0" height="90" fill="url(#pyth-grad-a)" stroke="#10b981" stroke-width="2" rx="4" />
    <!-- 3x3 internal subgrid -->
    <g opacity="0.4" stroke="#ffffff" stroke-width="0.8">
      <line x1="270" y1="220" x2="360" y2="220" />
      <line x1="270" y1="250" x2="360" y2="250" />
      <line x1="300" y1="190" x2="300" y2="280" />
      <line x1="330" y1="190" x2="330" y2="280" />
    </g>
    <text id="pyth-txt-a" x="315" y="240" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" opacity="0" filter="url(#pyth-glow)">a² = 9</text>
  </g>

  <!-- Side b Square (4 x 4 = 16 units) -->
  <g id="pyth-group-b">
    <rect id="pyth-rect-b" x="360" y="280" width="120" height="0" fill="url(#pyth-grad-b)" stroke="#3b82f6" stroke-width="2" rx="4" />
    <!-- 4x4 internal subgrid -->
    <g opacity="0.4" stroke="#ffffff" stroke-width="0.8">
      <line x1="360" y1="310" x2="480" y2="310" />
      <line x1="360" y1="340" x2="480" y2="340" />
      <line x1="360" y1="370" x2="480" y2="370" />
      <line x1="390" y1="280" x2="390" y2="400" />
      <line x1="420" y1="280" x2="420" y2="400" />
      <line x1="450" y1="280" x2="450" y2="400" />
    </g>
    <text id="pyth-txt-b" x="420" y="345" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" opacity="0" filter="url(#pyth-glow)">b² = 16</text>
  </g>

  <!-- Hypotenuse c Square (5 x 5 = 25 units, tilted across hypotenuse) -->
  <g id="pyth-group-c" transform="translate(360, 190) rotate(-36.87)">
    <rect id="pyth-rect-c" x="0" y="-150" width="150" height="150" fill="url(#pyth-grad-c)" stroke="#f59e0b" stroke-width="2" rx="4" opacity="0" />
    <text id="pyth-txt-c" x="75" y="-70" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle" opacity="0" filter="url(#pyth-glow)">c² = 25</text>
  </g>

  <!-- Core Right-Angled Triangle (3-4-5) -->
  <polygon points="360,280 480,280 360,190" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="3.5" filter="url(#pyth-glow)" />

  <!-- Right Angle Symbol -->
  <rect x="360" y="262" width="18" height="18" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle cx="369" cy="271" r="2.5" fill="#38bdf8" />

  <!-- Side Dimension Callout Labels -->
  <text x="345" y="238" fill="#34d399" font-size="14" font-weight="700" text-anchor="end">a = 3</text>
  <text x="420" y="302" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">b = 4</text>
  <text x="435" y="225" fill="#fbbf24" font-size="15" font-weight="800">c = 5</text>

  <!-- Triangle Vertices -->
  <circle cx="360" cy="280" r="4.5" fill="#38bdf8" />
  <circle cx="480" cy="280" r="4.5" fill="#38bdf8" />
  <circle cx="360" cy="190" r="4.5" fill="#38bdf8" />
</svg>
