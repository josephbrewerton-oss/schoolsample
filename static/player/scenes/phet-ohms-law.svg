<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <radialGradient id="phet-bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <filter id="phet-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#090d16"/>

  <!-- Apparatus Frame -->
  <rect x="20" y="16" width="760" height="448" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="40" y="46" fill="#f8fafc" font-size="20" font-weight="900" font-family="system-ui, sans-serif">
    PhET Invariant: Ohm's Law (V = I × R)
  </text>
  <rect x="40" y="58" width="160" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="120" y="72" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">PHYSICS &bull; CIRCUITS</text>

  <!-- Digital Multimeter HUD Bezel -->
  <g id="telemetry-bezel" transform="translate(460, 32)">
    <rect width="300" height="64" rx="8" fill="#030712" stroke="#22c55e" stroke-width="2"/>
    <text x="150" y="22" fill="#86efac" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">DIGITAL MULTIMETER (I = V / R)</text>
    <text id="current-readout" x="150" y="48" fill="#22c55e" font-size="22" font-weight="900" text-anchor="middle" font-family="monospace">
      I = 3.00 Amperes
    </text>
    <text id="power-readout" x="150" y="60" fill="#a3e635" font-size="10" font-weight="700" text-anchor="middle">
      Power: 36.0 W &bull; Closed Circuit
    </text>
  </g>

  <!-- Main Wire Loop (Heavy Conductor) -->
  <rect x="130" y="112" width="540" height="240" rx="28" fill="none" stroke="#334155" stroke-width="10"/>
  <rect id="active-wire" x="130" y="112" width="540" height="240" rx="28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 10"/>

  <!-- Moving Electron Charges Group -->
  <g id="electron-charges">
    <circle class="e-dot" id="edot-1" cx="130" cy="180" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-2" cx="130" cy="240" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-3" cx="240" cy="112" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-4" cx="340" cy="112" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-5" cx="440" cy="112" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-6" cx="540" cy="112" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-7" cx="670" cy="180" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-8" cx="670" cy="260" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-9" cx="550" cy="352" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-10" cx="450" cy="352" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-11" cx="350" cy="352" r="5" fill="#fde047"/>
    <circle class="e-dot" id="edot-12" cx="230" cy="352" r="5" fill="#fde047"/>
  </g>

  <!-- Component 1: DC Battery Stack (Left) -->
  <g id="battery-unit" transform="translate(85, 190)" data-pedagogical="ec-battery">
    <rect width="90" height="84" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="32" y="-10" width="26" height="10" rx="3" fill="#60a5fa"/>
    <text x="45" y="24" fill="#94a3b8" font-size="10" font-weight="800" text-anchor="middle">VOLTAGE</text>
    <text id="txt-voltage" x="45" y="48" fill="#38bdf8" font-size="18" font-weight="900" text-anchor="middle" font-family="monospace">12.0 V</text>
    <text x="45" y="68" fill="#64748b" font-size="9" font-weight="700" text-anchor="middle">BATTERY STACK</text>
  </g>

  <!-- Component 2: Resistor Unit (Top) -->
  <g id="resistor-unit" transform="translate(360, 92)" data-pedagogical="ec-resistor">
    <rect width="84" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="22" y1="8" x2="22" y2="32" stroke="#ef4444" stroke-width="4"/>
    <line x1="36" y1="8" x2="36" y2="32" stroke="#10b981" stroke-width="4"/>
    <line x1="50" y1="8" x2="50" y2="32" stroke="#f59e0b" stroke-width="4"/>
    <line x1="64" y1="8" x2="64" y2="32" stroke="#eab308" stroke-width="4"/>
    <text id="txt-resistance" x="42" y="-6" fill="#facc15" font-size="14" font-weight="900" text-anchor="middle" font-family="monospace">4.0 &Omega;</text>
  </g>

  <!-- Component 3: Lightbulb Load (Right) -->
  <g id="lightbulb" transform="translate(670, 230)" data-pedagogical="ec-bulb">
    <!-- Halo glow -->
    <circle id="bulb-halo" cx="0" cy="0" r="54" fill="url(#phet-bulbGlow)" opacity="0.85"/>
    <circle cx="0" cy="0" r="28" fill="rgba(255, 255, 255, 0.15)" stroke="#facc15" stroke-width="2.5" filter="url(#phet-glow-filter)"/>
    <path d="M -9 12 L -4 -8 L 0 8 L 4 -8 L 9 12" fill="none" stroke="#fef08a" stroke-width="2.5"/>
    <text x="0" y="46" fill="#fde047" font-size="11" font-weight="800" text-anchor="middle">LOAD</text>
  </g>

  <!-- Component 4: Interactive Knife Switch (Bottom) -->
  <g id="circuit-switch" data-interactive="switch" data-action="toggle-switch" data-state="closed" transform="translate(360, 332)" style="cursor: pointer;" data-pedagogical="ec-switch">
    <rect x="-15" y="-6" width="110" height="50" rx="6" fill="rgba(30, 41, 59, 0.85)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="10" cy="16" r="6" fill="#22c55e"/>
    <line id="switch-blade" x1="10" y1="16" x2="70" y2="16" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="16" r="6" fill="#22c55e"/>
    <text id="switch-text" x="40" y="38" fill="#4ade80" font-size="10" font-weight="800" text-anchor="middle">SWITCH: CLOSED (Click)</text>
  </g>

  <!-- In-Stage Control Station 1: Voltage Controls (Bottom-Left) -->
  <g id="voltage-controls" transform="translate(40, 396)">
    <rect width="330" height="56" rx="8" fill="#0b0f19" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="12" y="20" fill="#93c5fd" font-size="11" font-weight="800">VOLTAGE (V):</text>
    <text id="ctrl-v-val" x="120" y="20" fill="#38bdf8" font-size="12" font-weight="900" font-family="monospace">12.0 V</text>
    
    <!-- Steppers -->
    <g data-action="phet-v-dec" style="cursor: pointer;" transform="translate(180, 8)">
      <rect width="28" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="14" y="15" fill="#f8fafc" font-size="13" font-weight="900" text-anchor="middle">-</text>
    </g>
    <g data-action="phet-v-inc" style="cursor: pointer;" transform="translate(214, 8)">
      <rect width="28" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="14" y="15" fill="#f8fafc" font-size="13" font-weight="900" text-anchor="middle">+</text>
    </g>
    <g data-action="phet-enter-voltage" style="cursor: pointer;" transform="translate(248, 8)">
      <rect width="70" height="20" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="35" y="14" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">✎ ENTER</text>
    </g>

    <!-- Slider Track & Draggable Knob -->
    <line x1="14" y1="42" x2="316" y2="42" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="14" y1="42" x2="165" y2="42" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" id="v-slider-fill"/>
    <circle id="phet-v-knob" cx="165" cy="42" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" style="cursor: ew-resize;" data-draggable="generic" data-gesture-axis="x" data-gesture-min-x="14" data-gesture-max-x="316" data-gesture-var="voltage"/>
  </g>

  <!-- In-Stage Control Station 2: Resistance Controls (Bottom-Right) -->
  <g id="resistance-controls" transform="translate(430, 396)">
    <rect width="330" height="56" rx="8" fill="#0b0f19" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="20" fill="#fde047" font-size="11" font-weight="800">RESISTANCE (&Omega;):</text>
    <text id="ctrl-r-val" x="130" y="20" fill="#fbbf24" font-size="12" font-weight="900" font-family="monospace">4.0 &Omega;</text>
    
    <!-- Steppers -->
    <g data-action="phet-r-dec" style="cursor: pointer;" transform="translate(180, 8)">
      <rect width="28" height="20" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="14" y="15" fill="#f8fafc" font-size="13" font-weight="900" text-anchor="middle">-</text>
    </g>
    <g data-action="phet-r-inc" style="cursor: pointer;" transform="translate(214, 8)">
      <rect width="28" height="20" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="14" y="15" fill="#f8fafc" font-size="13" font-weight="900" text-anchor="middle">+</text>
    </g>
    <g data-action="phet-enter-resistance" style="cursor: pointer;" transform="translate(248, 8)">
      <rect width="70" height="20" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="1"/>
      <text x="35" y="14" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">✎ ENTER</text>
    </g>

    <!-- Slider Track & Draggable Knob -->
    <line x1="14" y1="42" x2="316" y2="42" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="14" y1="42" x2="74" y2="42" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" id="r-slider-fill"/>
    <circle id="phet-r-knob" cx="74" cy="42" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="2" style="cursor: ew-resize;" data-draggable="generic" data-gesture-axis="x" data-gesture-min-x="14" data-gesture-max-x="316" data-gesture-var="resistance"/>
  </g>
</svg>
