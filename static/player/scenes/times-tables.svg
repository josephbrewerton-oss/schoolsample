<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="tt-bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Emerald Tile Gradient (7x5) -->
    <linearGradient id="tt-tile-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber Tile Gradient (7x3) -->
    <linearGradient id="tt-tile-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Unified Blue Tile Gradient (7x8 Initial) -->
    <linearGradient id="tt-tile-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Neon Splitter Laser Filter -->
    <filter id="tt-laser-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#tt-bg-glow)" />

  <!-- Subtle Mathematical Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="1">
      TIMES TABLES: 2D ARRAY &amp; DISTRIBUTIVE SPLITTER
    </text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Never Panic Over Hard Tables &bull; Decompose 7 &times; 8 into Friendly (7 &times; 5) + (7 &times; 3)
    </text>
  </g>

  <!-- Main Stage: Left 7x8 Array Grid Container -->
  <g transform="translate(40, 95)">
    <rect width="440" height="320" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Row & Column Labels -->
    <text x="220" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">
      7 Rows &times; 8 Columns = 56 Total Area Units
    </text>

    <!-- Column Bracket Indicators -->
    <g transform="translate(30, 36)">
      <!-- Left 5 Columns Label -->
      <g id="tt-col-5-label" opacity="0">
        <rect x="0" y="0" width="220" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" />
        <text x="110" y="13" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">
          5 COLUMNS (7 &times; 5 = 35)
        </text>
      </g>

      <!-- Right 3 Columns Label -->
      <g id="tt-col-3-label" opacity="0">
        <rect x="235" y="0" width="135" height="18" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" />
        <text x="302" y="13" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">
          3 COLS (7 &times; 3 = 21)
        </text>
      </g>
    </g>

    <!-- 7 x 8 Grid Elements (30px spacing) -->
    <g transform="translate(30, 65)">
      <!-- Left 5 Columns (Columns 0 to 4 across 7 Rows) -->
      <g id="tt-grid-emerald">
        <!-- Render 7 rows of 5 columns -->
        <!-- Row 0 -->
        <rect x="0" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="45" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="90" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="135" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="180" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />

        <!-- Row 1 -->
        <rect x="0" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="45" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="90" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="135" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="180" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />

        <!-- Row 2 -->
        <rect x="0" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="45" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="90" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="135" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="180" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />

        <!-- Row 3 -->
        <rect x="0" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="45" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="90" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="135" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="180" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />

        <!-- Row 4 -->
        <rect x="0" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="45" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="90" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="135" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="180" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />

        <!-- Row 5 -->
        <rect x="0" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="45" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="90" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="135" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="180" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />

        <!-- Row 6 -->
        <rect x="0" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="45" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="90" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="135" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
        <rect x="180" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-emerald)" />
      </g>

      <!-- Laser Divider (Flashes during split) -->
      <line id="tt-splitter-laser" x1="227" y1="-5" x2="227" y2="240" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" filter="url(#tt-laser-glow)" opacity="0" />

      <!-- Right 3 Columns (Columns 5, 6, 7 across 7 Rows) -->
      <g id="tt-grid-amber">
        <!-- Row 0 -->
        <rect x="235" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="280" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="325" y="0" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />

        <!-- Row 1 -->
        <rect x="235" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="280" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="325" y="34" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />

        <!-- Row 2 -->
        <rect x="235" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="280" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="325" y="68" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />

        <!-- Row 3 -->
        <rect x="235" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="280" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="325" y="102" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />

        <!-- Row 4 -->
        <rect x="235" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="280" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="325" y="136" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />

        <!-- Row 5 -->
        <rect x="235" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="280" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="325" y="170" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />

        <!-- Row 6 -->
        <rect x="235" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="280" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
        <rect x="325" y="204" width="38" height="28" rx="4" fill="url(#tt-tile-amber)" />
      </g>
    </g>
  </g>

  <!-- Right Side: Mental Mathematics Architecture Card -->
  <g transform="translate(500, 95)">
    <rect width="260" height="320" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <text x="130" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">
      🧠 DISTRIBUTIVE POWER
    </text>

    <!-- Formula Stages -->
    <g transform="translate(20, 60)">
      <rect width="220" height="50" rx="8" fill="#1e293b" stroke="#475569" />
      <text x="110" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">
        TARGET EQUATION
      </text>
      <text x="110" y="42" font-family="system-ui, monospace" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">
        7 &times; 8 = ?
      </text>
    </g>

    <g id="tt-step2-box" opacity="0" transform="translate(20, 120)">
      <rect width="220" height="54" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
      <text x="110" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">
        STEP 1: FRIENDLY 5s
      </text>
      <text x="110" y="42" font-family="system-ui, monospace" font-size="18" font-weight="900" fill="#4ade80" text-anchor="middle">
        7 &times; 5 = 35
      </text>
    </g>

    <g id="tt-step3-box" opacity="0" transform="translate(20, 184)">
      <rect width="220" height="54" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" />
      <text x="110" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">
        STEP 2: REMAINING 3s
      </text>
      <text x="110" y="42" font-family="system-ui, monospace" font-size="18" font-weight="900" fill="#fcd34d" text-anchor="middle">
        7 &times; 3 = 21
      </text>
    </g>

    <g id="tt-step4-box" opacity="0" transform="translate(20, 248)">
      <rect width="220" height="56" rx="8" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="2" />
      <text x="110" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">
        STEP 3: MENTAL RE-COMBINATION
      </text>
      <text x="110" y="44" font-family="system-ui, monospace" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle">
        35 + 21 = 56
      </text>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 430)">
    <rect width="720" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text id="tt-banner-txt" x="360" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">
      The Distributive Property: 7 × 8 = 7 × (5 + 3) = 35 + 21 = 56.
    </text>
  </g>
</svg>
