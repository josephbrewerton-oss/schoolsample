<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Quantum Vacuum Space Gradient -->
    <radialGradient id="atom-space-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Proton Particle Gradient (Ruby Quarks) -->
    <radialGradient id="proton-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="30%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Neutron Particle Gradient (Neutral Slate) -->
    <radialGradient id="neutron-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <!-- Electron Quantum Core Gradient -->
    <radialGradient id="electron-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7dd3fc" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Nuclear Strong Force Aura Filter -->
    <filter id="nucleus-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Electron High-Energy Glare Filter -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Quantum Space Canvas -->
  <rect x="0" y="0" width="800" height="480" fill="url(#atom-space-glow)" />

  <!-- Top Glassmorphic Chemistry Legend Banner -->
  <g transform="translate(140, 16)">
    <rect width="520" height="44" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#6366f1" stroke-width="1.5" />
    <text x="260" y="27" fill="#f8fafc" font-size="15" font-weight="800" text-anchor="middle" font-family="sans-serif">
      <tspan fill="#f87171">● 6 Protons (+)</tspan> | <tspan fill="#94a3b8">● 6 Neutrons (0)</tspan> | <tspan fill="#38bdf8">● 6 Electrons (-)</tspan> ➔ Carbon-12
    </text>
  </g>

  <!-- Central Strong-Force Nuclear Core Glow -->
  <circle cx="400" cy="240" r="32" fill="#ef4444" opacity="0.18" filter="url(#nucleus-glow)" />

  <!-- 3D Inclined Bohr Electron Shell Trajectories -->
  <g filter="url(#glow)">
    <path id="atom-ring-k" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3" opacity="0.85" />
    <path id="atom-ring-l1" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75" />
    <path id="atom-ring-l2" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75" />
  </g>

  <!-- 3D Dense Central Nucleus Particles (Carbon Nucleus) -->
  <g id="nucleus-cluster">
    <circle id="nucleus-p1" cx="400" cy="240" r="10" fill="url(#proton-grad)" stroke="#fca5a5" stroke-width="1" />
    <circle id="nucleus-n1" cx="400" cy="240" r="10" fill="url(#neutron-grad)" stroke="#e2e8f0" stroke-width="1" />
    <circle id="nucleus-p2" cx="400" cy="240" r="10" fill="url(#proton-grad)" stroke="#fca5a5" stroke-width="1" />
    <circle id="nucleus-n2" cx="400" cy="240" r="10" fill="url(#neutron-grad)" stroke="#e2e8f0" stroke-width="1" />
    <circle id="nucleus-p3" cx="400" cy="240" r="10" fill="url(#proton-grad)" stroke="#fca5a5" stroke-width="1" />
    <circle id="nucleus-n3" cx="400" cy="240" r="10" fill="url(#neutron-grad)" stroke="#e2e8f0" stroke-width="1" />
  </g>

  <!-- Quantized Orbiting 3D Electrons -->
  <g id="electrons" filter="url(#glow)">
    <!-- Inner K-Shell (n=1) Pair -->
    <circle id="atom-e1" cx="400" cy="240" r="6.5" fill="url(#electron-grad)" stroke="#ffffff" stroke-width="1.5" />
    <circle id="atom-e2" cx="400" cy="240" r="6.5" fill="url(#electron-grad)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Outer L-Shell (n=2) Valence Quad -->
    <circle id="atom-oe-0" cx="400" cy="240" r="6.5" fill="url(#electron-grad)" stroke="#ffffff" stroke-width="1.5" />
    <circle id="atom-oe-1" cx="400" cy="240" r="6.5" fill="url(#electron-grad)" stroke="#ffffff" stroke-width="1.5" />
    <circle id="atom-oe-2" cx="400" cy="240" r="6.5" fill="url(#electron-grad)" stroke="#ffffff" stroke-width="1.5" />
    <circle id="atom-oe-3" cx="400" cy="240" r="6.5" fill="url(#electron-grad)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Interactive 3D Spatial Compass Hint -->
  <g transform="translate(40, 420)">
    <rect width="180" height="32" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="90" y="21" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">
      🖱️ Drag to Orbit in 3D
    </text>
  </g>
</svg>
