<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#030712" />

  <!-- 3D Inclined Bohr Electron Shells -->
  <path id="atom-ring-k" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
  <path id="atom-ring-l1" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="atom-ring-l2" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- 3D Dense Central Nucleus Particles -->
  <circle id="nucleus-p1" cx="400" cy="240" r="10" fill="#ef4444" stroke="#f87171" stroke-width="1" />
  <circle id="nucleus-n1" cx="400" cy="240" r="10" fill="#64748b" stroke="#94a3b8" stroke-width="1" />
  <circle id="nucleus-p2" cx="400" cy="240" r="10" fill="#ef4444" stroke="#f87171" stroke-width="1" />
  <circle id="nucleus-n2" cx="400" cy="240" r="10" fill="#64748b" stroke="#94a3b8" stroke-width="1" />
  <circle id="nucleus-p3" cx="400" cy="240" r="10" fill="#ef4444" stroke="#f87171" stroke-width="1" />
  <circle id="nucleus-n3" cx="400" cy="240" r="10" fill="#64748b" stroke="#94a3b8" stroke-width="1" />

  <!-- Orbiting 3D Electrons -->
  <circle id="atom-e1" cx="400" cy="240" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle id="atom-e2" cx="400" cy="240" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle id="atom-oe-0" cx="400" cy="240" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle id="atom-oe-1" cx="400" cy="240" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle id="atom-oe-2" cx="400" cy="240" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle id="atom-oe-3" cx="400" cy="240" r="6" fill="#38bdf8" filter="url(#glow)" />
</svg>
