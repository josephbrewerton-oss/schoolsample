<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Neural WebRTC Daemon</title>
</head>
<body>
  <script type="module">
    import { buildUniversalPrompt } from './promptStrategies.js';

    console.log('[Worker Daemon] Booting WebRTC Daemon at:', window.location.href);

    const bus = new BroadcastChannel('webrtc-neural-signaling');
    let pc = null;
    let activeChannel = null;
    let isConnecting = false;
    let isBusy = false;

    async function initAndOffer() {
      if (activeChannel && activeChannel.readyState === 'open') return;
      if (isConnecting) return;

      isConnecting = true;
      if (pc) {
        try { pc.close(); } catch {}
      }

      console.log('[Worker Daemon] Initializing PeerConnection & DataChannel...');
      pc = new RTCPeerConnection({ iceServers: [] });

      const dc = pc.createDataChannel('neural-bus');
      activeChannel = dc;

      dc.onopen = () => {
        isConnecting = false;
        console.log('[Worker Daemon] DataChannel OPEN. Connected to Hypervisor.');
      };

      dc.onclose = () => {
        isConnecting = false;
        console.log('[Worker Daemon] DataChannel CLOSED.');
      };

      dc.onmessage = async (event) => {
        if (isBusy) return;
        processIntent(event.data, dc);
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          bus.postMessage({ type: 'candidate', candidate: e.candidate.toJSON() });
        }
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        console.log('[Worker Daemon] Broadcasting Offer to Hypervisor...');
        bus.postMessage({ type: 'offer', sdp: pc.localDescription.toJSON() });
      } catch (err) {
        isConnecting = false;
        console.error('[Worker Daemon] Offer creation failed:', err);
      }
    }

    bus.onmessage = async (e) => {
      const data = e.data;
      if (!data) return;

      if (data.type === 'peer_ready') {
        initAndOffer();
      } else if (data.type === 'answer' && pc) {
        if (pc.signalingState === 'have-local-offer') {
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          } catch (err) {
            console.warn('[Worker Daemon] Answer error:', err);
          }
        }
      } else if (data.type === 'candidate' && pc && data.candidate) {
        try {
          if (pc.remoteDescription && pc.signalingState !== 'closed') {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
          }
        } catch {}
      }
    };

    async function createFreshSession(systemInstruction) {
      const aiHost = window.ai || self.ai || window.parent?.ai || (typeof ai !== 'undefined' ? ai : null);
      const GlobalLM = window.LanguageModel || window.parent?.LanguageModel;

      const options = {
        systemPrompt: systemInstruction,
        expectedInputLanguages: ['en'],
        expectedOutputLanguages: ['en']
      };

      if (aiHost?.languageModel) {
        try { return await aiHost.languageModel.create(options); } catch {
          try { return await aiHost.languageModel.create(); } catch {}
        }
      }
      if (GlobalLM?.create) {
        try { return await GlobalLM.create(options); } catch {
          try { return await GlobalLM.create(); } catch {}
        }
      }
      return null;
    }

    // Inside static/worker.html -> processIntent()
// Inside static/worker.html -> processIntent()
async function processIntent(rawIntent, dc) {
  isBusy = true;
  let session = null;
  try {
    let parsed = rawIntent;
    if (typeof rawIntent === 'string') {
      try { parsed = JSON.parse(rawIntent); } catch {}
    }

    const subject = parsed?.subject || parsed?.sub || 'English';
    const topic = parsed?.unit || parsed?.topic || parsed?.u || 'Shakespeare: Key Themes';
    const keyStage = parsed?.keyStage || parsed?.ks || 'Key Stage 3';
    const curriculum = parsed?.curriculum || 'uk_oak';

    const systemInstruction = `You are an expert UK curriculum teacher. Create multiple-choice questions matching the given subject, topic, and Key Stage level. Output strictly as a valid Lisp S-expression.`;

    session = await createFreshSession(systemInstruction);

    // Clean direct instruction without repetitive template keys
    const prompt = `Topic: "${topic}" (${keyStage} ${subject}).
Generate 1 multiple choice question testing understanding of "${topic}".

Format:
(:route "quiz:mcq"
 :scratchpad "Explanation of correct concept"
 :prompt "Write a specific question directly testing knowledge of ${topic} here"
 :options ("Correct answer" "Plausible wrong answer 1" "Plausible wrong answer 2" "Plausible wrong answer 3")
 :answer-key 0
 :hint "Short clue under 15 words")`;

    const response = await session.prompt(prompt);

    let sanitized = response
      .replace(/```(?:lisp|scheme)?/gi, '')
      .replace(/```/g, '')
      .trim();

    const firstParen = sanitized.indexOf('(');
    const lastParen = sanitized.lastIndexOf(')');
    if (firstParen !== -1 && lastParen !== -1 && lastParen > firstParen) {
      sanitized = sanitized.substring(firstParen, lastParen + 1);
    }

    if (dc.readyState === 'open') {
      dc.send(JSON.stringify({
        type: 'AST_RESPONSE',
        raw: sanitized,
        keyStage,
        subject,
        unit: topic
      }));
      dc.send('__EOF__');
    }
  } catch (err) {
    console.error('[Worker Daemon Error]:', err);
    if (dc.readyState === 'open') dc.send('__EOF__');
  } finally {
    isBusy = false;
    if (session?.destroy) {
      try { session.destroy(); } catch {}
    }
  }
}
    // Announce ready immediately
    bus.postMessage({ type: 'daemon_ready' });
  </script>
</body>
</html>
