<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Neural WebRTC Guest VM Daemon</title>
</head>
<body>
  <script type="module">
    console.log('[Guest VM Daemon] Booting Supervised Guest VM at:', window.location.href);

    const signalingBus = new BroadcastChannel('webrtc-neural-signaling');
    const hypervisorBus = new BroadcastChannel('neural_hypervisor_bus');

    let pc = null;
    let activeChannel = null;
    let isConnecting = false;
    let isBusy = false;

    // Warm Session Cache for low-latency inference (< 250ms per token vs 800ms+ cold start)
    let cachedSession = null;
    let currentSystemInstruction = '';
    const pendingHypercalls = new Map();

    function sendToHypervisor(payload) {
      const msg = { ...payload, __neural_guest__: true };
      
      // 1. Direct parent postMessage (< 0.1ms fast-path)
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(msg, '*');
        } catch {}
      }

      // 2. WebRTC DataChannel (if open)
      if (activeChannel && activeChannel.readyState === 'open') {
        try {
          activeChannel.send(JSON.stringify(msg));
          activeChannel.send('__EOF__');
        } catch {}
      }

      // 3. Signaling Bus fallback
      try {
        signalingBus.postMessage(msg);
      } catch {}
    }

    // Hypercall primitive: allows guest VM to invoke host capabilities (Curriculum, RAG, etc.)
    function makeHypercall(target, message, timeoutMs = 2000) {
      const id = `hc_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
      return new Promise((resolve) => {
        const timer = setTimeout(() => {
          pendingHypercalls.delete(id);
          resolve({ ok: false, error: 'Hypercall timeout' });
        }, timeoutMs);

        pendingHypercalls.set(id, { resolve, timer });

        sendToHypervisor({
          type: 'HYPERCALL',
          id,
          target,
          message,
        });
      });
    }

    function handleHypercallResponse(data) {
      const pending = pendingHypercalls.get(data.id);
      if (pending) {
        clearTimeout(pending.timer);
        pendingHypercalls.delete(data.id);
        pending.resolve(data);
      }
    }

    // WebRTC PeerConnection initialization
    async function initAndOffer() {
      if (activeChannel && activeChannel.readyState === 'open') return;
      if (isConnecting) return;

      isConnecting = true;
      if (pc) {
        try { pc.close(); } catch {}
      }

      console.log('[Guest VM Daemon] Initializing PeerConnection & DataChannel...');
      pc = new RTCPeerConnection({ iceServers: [] });

      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          isConnecting = false;
          activeChannel = null;
        }
      };

      const dc = pc.createDataChannel('neural-bus', { ordered: true });
      activeChannel = dc;

      dc.onopen = () => {
        isConnecting = false;
        console.log('[Guest VM Daemon] DataChannel OPEN. Connected to Hypervisor.');
      };

      dc.onclose = () => {
        isConnecting = false;
        activeChannel = null;
      };

      dc.onmessage = async (event) => {
        if (event.data === '__EOF__' || isBusy) return;
        try {
          const parsed = JSON.parse(event.data);
          processHypervisorCommand(parsed);
        } catch {}
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          signalingBus.postMessage({ type: 'candidate', candidate: e.candidate.toJSON() });
        }
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        signalingBus.postMessage({ type: 'offer', sdp: pc.localDescription.toJSON() });
      } catch (err) {
        isConnecting = false;
      }
    }

    // Session Management with Warm Session Pool adhering to W3C Prompt API
    async function getOrCreateWarmSession(systemInstruction) {
      const aiHost = window.ai || self.ai || window.parent?.ai || (typeof ai !== 'undefined' ? ai : null);
      const GlobalLM = window.LanguageModel || window.parent?.LanguageModel;
      const target = aiHost?.languageModel || GlobalLM;

      if (!target?.create) return null;

      if (cachedSession && currentSystemInstruction === systemInstruction) {
        return cachedSession;
      }

      if (cachedSession?.destroy) {
        try { cachedSession.destroy(); } catch {}
        cachedSession = null;
      }

      // 1. Primary config: Standard Chrome Prompt API with explicit outputLanguage
      try {
        cachedSession = await target.create({
          systemPrompt: systemInstruction,
          outputLanguage: 'en',
          expectedOutputLanguages: ['en'],
          expectedInputLanguages: ['en'],
          temperature: 0.2,
          topK: 3,
        });
        currentSystemInstruction = systemInstruction;
        return cachedSession;
      } catch (err1) {
        try {
          // 2. Minimal config with outputLanguage
          cachedSession = await target.create({
            systemPrompt: systemInstruction,
            outputLanguage: 'en',
            expectedOutputLanguages: ['en'],
            expectedInputLanguages: ['en'],
          });
          currentSystemInstruction = systemInstruction;
          return cachedSession;
        } catch (err2) {
          try {
            // 3. Fallback without extra parameters
            cachedSession = await target.create({
              systemPrompt: systemInstruction,
            });
            currentSystemInstruction = systemInstruction;
            return cachedSession;
          } catch (err3) {
            console.warn('[Guest VM Daemon] All LanguageModel create variations failed:', err3);
            return null;
          }
        }
      }
    }

    function resetWarmSession() {
      if (cachedSession?.destroy) {
        try { cachedSession.destroy(); } catch {}
      }
      cachedSession = null;
      currentSystemInstruction = '';
    }

    // Inference Request Queue & Deduplication
    const processedRequestIds = new Set();
    const inferenceQueue = [];

    function enqueueInference(payload) {
      const requestId = payload.requestId || `req_${Date.now()}`;
      if (processedRequestIds.has(requestId)) {
        return;
      }
      processedRequestIds.add(requestId);
      if (processedRequestIds.size > 200) {
        const oldest = processedRequestIds.values().next().value;
        processedRequestIds.delete(oldest);
      }

      inferenceQueue.push({ ...payload, requestId });
      runNextInference();
    }

    async function runNextInference() {
      if (isBusy || inferenceQueue.length === 0) return;
      const nextPayload = inferenceQueue.shift();
      if (!nextPayload) return;

      isBusy = true;
      try {
        await executeInferenceWithRetry(nextPayload);
      } finally {
        isBusy = false;
        // Schedule next request in queue
        setTimeout(runNextInference, 10);
      }
    }

    async function executeInferenceWithRetry(payload, isRetry = false) {
      const requestId = payload.requestId;

      try {
        const subject = payload.subject || payload.sub || 'English';
        const topic = payload.unit || payload.topic || payload.u || 'General Topic';
        const keyStage = payload.keyStage || payload.ks || 'Key Stage 2';
        const difficulty = payload.difficulty || 'challenger';

        // 1. Hypercall to Host for Ground Truth Curriculum Axioms & Misconceptions
        let curriculumAxiom = '';
        let cognitiveTrap = '';
        try {
          const hcRes = await makeHypercall('curriculumnode', {
            intent: 'get:package',
            payload: { stage: keyStage, subject, topic },
          }, 1500);

          if (hcRes.ok && hcRes.data) {
            curriculumAxiom = hcRes.data.coreAxiom || hcRes.data.axiom || '';
            cognitiveTrap = hcRes.data.cognitiveTrap || hcRes.data.trap || '';
          }
        } catch {}

        const systemInstruction = `UK National Curriculum Educator. Output strictly 1 valid Lisp S-expression adhering to quiz.rules.ast. No markdown fences or commentary.`;

        let session = await getOrCreateWarmSession(systemInstruction);
        if (!session) {
          throw new Error('On-device LanguageModel session unavailable on this device.');
        }

        const prompt = `Topic: "${topic}" (${keyStage} ${subject}).
${curriculumAxiom ? `Curriculum Axiom: "${curriculumAxiom}"\n` : ''}${cognitiveTrap ? `Pupil Misconception: "${cognitiveTrap}"\n` : ''}Task: Generate 1 diagnostic multiple-choice question testing understanding of "${topic}".
Requirements: Exactly 4 distinct options (no 'A)' or 'Option 1' prefixes). The :answer-key must be the 0-indexed integer of the correct answer. Hint under 15 words.

Format strictly as:
(:route "quiz:mcq"
 :scratchpad "Pedagogical rule for correct answer"
 :prompt "Clear question prompt?"
 :options ("Option 1" "Option 2" "Option 3" "Option 4")
 :answer-key 0
 :hint "Short clue under 15 words")`;

        // Non-destructive inference execution:
        // Avoid aggressive AbortController aborts that tear down Chromium's native Mojo session.
        let response = '';
        let timerHandle;
        const timeoutPromise = new Promise((_, reject) => {
          timerHandle = setTimeout(() => {
            reject(new Error('Prompt execution timeout (30s)'));
          }, 30000);
        });

        try {
          try {
            response = await Promise.race([session.prompt(prompt), timeoutPromise]);
          } catch (promptErr) {
            const errMsg = String(promptErr?.message || '').toLowerCase();
            const isInvalidState = promptErr?.name === 'InvalidStateError' || 
              errMsg.includes('destroyed') || 
              errMsg.includes('aborted');

            if (isInvalidState && !isRetry) {
              console.warn('[Guest VM Daemon] Session was invalid or destroyed; provisioning fresh session and retrying...');
              resetWarmSession();
              session = await getOrCreateWarmSession(systemInstruction);
              if (session) {
                response = await Promise.race([session.prompt(prompt), timeoutPromise]);
              } else {
                throw promptErr;
              }
            } else {
              throw promptErr;
            }
          }
        } finally {
          clearTimeout(timerHandle);
        }

        let sanitized = (response || '')
          .replace(/```(?:lisp|scheme)?/gi, '')
          .replace(/```/g, '')
          .trim();

        const firstParen = sanitized.indexOf('(');
        const lastParen = sanitized.lastIndexOf(')');
        if (firstParen !== -1 && lastParen !== -1 && lastParen > firstParen) {
          sanitized = sanitized.substring(firstParen, lastParen + 1);
        }

        sendToHypervisor({
          type: 'AST_RESPONSE',
          requestId,
          raw: sanitized,
          keyStage,
          subject,
          unit: topic,
        });
      } catch (err) {
        console.error('[Guest VM Inference Error]:', err);
        // On fatal session failure, discard warm session
        resetWarmSession();

        sendToHypervisor({
          type: 'AST_ERROR',
          requestId,
          error: err?.message || 'Inference execution failed in guest VM daemon.',
        });
      }
    }

    function processHypervisorCommand(data) {
      if (!data) return;

      switch (data.type) {
        case 'SUPERVISOR_PING':
          sendToHypervisor({
            type: 'SUPERVISOR_PONG',
            pingTimestamp: data.timestamp,
            sessionWarm: Boolean(cachedSession),
            isBusy,
          });
          break;

        case 'RESET_INSTANCE':
          console.log('[Guest VM Daemon] Received RESET_INSTANCE command from Hypervisor.');
          resetWarmSession();
          isBusy = false;
          sendToHypervisor({ type: 'GUEST_READY', sessionWarm: false, capabilities: ['prompt-api', 'hypercalls', 'warm-session'] });
          break;

        case 'HYPERCALL_RESPONSE':
          handleHypercallResponse(data);
          break;

        case 'REQUEST_QUESTION':
        case 'EXEC_PROMPT':
          enqueueInference(data);
          break;

        default:
          break;
      }
    }

    // Hypervisor Communication Listeners
    window.addEventListener('message', (event) => {
      if (event.data && typeof event.data === 'object' && event.data.__neural_hypervisor__) {
        processHypervisorCommand(event.data);
      }
    });

    signalingBus.onmessage = async (e) => {
      const data = e.data;
      if (!data) return;

      if (data.__neural_hypervisor__) {
        processHypervisorCommand(data);
        return;
      }

      if (data.type === 'peer_ready') {
        initAndOffer();
      } else if (data.type === 'answer' && pc) {
        if (pc.signalingState === 'have-local-offer') {
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          } catch {}
        }
      } else if (data.type === 'candidate' && pc && data.candidate) {
        try {
          if (pc.remoteDescription && pc.signalingState !== 'closed') {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
          }
        } catch {}
      }
    };

    // Announce availability to Hypervisor Host
    sendToHypervisor({
      type: 'GUEST_READY',
      sessionWarm: Boolean(cachedSession),
      capabilities: ['prompt-api', 'hypercalls', 'warm-session', 'watchdog-managed'],
    });
  </script>
</body>
</html>
