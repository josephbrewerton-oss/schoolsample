<svg viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globe-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="heavens-canopy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#globe-bg)"/>
  
  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#fef08a" font-size="18" font-weight="900">THE GLOBE THEATRE (1599) &amp; IAMBIC PENTAMETER</text>
  
  <!-- The Heavens Canopy -->
  <polygon points="180,85 620,85 570,42 230,42" fill="url(#heavens-canopy)" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="65" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="bold">THE HEAVENS (Sun, Moon &amp; Zodiac Roof)</text>
  
  <!-- Upper Gallery / Frons Scenae -->
  <rect x="200" y="85" width="400" height="75" rx="4" fill="#292524" stroke="#78350f" stroke-width="2"/>
  <text x="400" y="118" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="bold">BALCONY / TARRAS (Juliet’s Window)</text>
  <rect x="360" y="128" width="80" height="30" rx="3" fill="#1c1917" stroke="#b45309" stroke-width="1.5"/>
  <text x="400" y="148" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="bold">MUSIC ROOM</text>
  
  <!-- Lower Stage Wall (Doors of Entry) -->
  <rect x="200" y="160" width="400" height="90" fill="#44403c" stroke="#78350f" stroke-width="2"/>
  <rect x="230" y="175" width="45" height="75" rx="4" fill="#1c1917" stroke="#b45309" stroke-width="1.5"/>
  <text x="252" y="220" text-anchor="middle" fill="#fed7aa" font-size="9" font-weight="bold">ENTRY</text>
  
  <!-- Discovery Space (Central Discovery) -->
  <rect x="350" y="175" width="100" height="75" rx="4" fill="#1c1917" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="215" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">DISCOVERY</text>
  <text x="400" y="230" text-anchor="middle" fill="#94a3b8" font-size="8">SPACE</text>
  
  <rect x="525" y="175" width="45" height="75" rx="4" fill="#1c1917" stroke="#b45309" stroke-width="1.5"/>
  <text x="547" y="220" text-anchor="middle" fill="#fed7aa" font-size="9" font-weight="bold">ENTRY</text>
  
  <!-- The Thrust Stage Floor (Extending into the Yard) -->
  <polygon points="160,250 640,250 690,370 110,370" fill="#78350f" stroke="#b45309" stroke-width="3"/>
  <text x="400" y="325" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="bold">THRUST STAGE (Surrounded on 3 Sides by Groundlings)</text>
  
  <!-- Trapdoor (Hell) -->
  <rect x="370" y="275" width="60" height="28" rx="3" fill="#1c1917" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="293" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="bold">TRAPDOOR (HELL)</text>
  
  <!-- Stage Pillars Supporting the Heavens -->
  <rect x="245" y="85" width="14" height="165" fill="#d97706" rx="3"/>
  <rect x="541" y="85" width="14" height="165" fill="#d97706" rx="3"/>
  
  <!-- Real-Time Iambic Pulse Line (EKG Heartbeat of the Bard) -->
  <g id="iambic-pulse-bar" transform="translate(150, 395)">
    <rect width="500" height="65" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="250" y="24" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold" id="iambic-status-text">
      IAMBIC PENTAMETER: da-DUM da-DUM da-DUM da-DUM da-DUM
    </text>
    <path id="iambic-wave" d="M 20 45 L 80 45 L 95 32 L 110 45 L 170 45 L 185 28 L 200 45 L 260 45 L 275 28 L 290 45 L 350 45 L 365 28 L 380 45 L 440 45 L 455 28 L 480 45" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle id="iambic-dot" cx="20" cy="45" r="5" fill="#ef4444"/>
  </g>
</svg>
