<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>St Joseph's Curriculum Portal</title>
    <meta
      name="description"
      content="Interactive UK National Curriculum portal and offline-first edge AI engine, perpetually free for Catholic organisations and emerging nations"
    />
    <meta property="og:title" content="St Joseph's Curriculum Portal" />
    <meta
      property="og:description"
      content="Interactive UK National Curriculum portal and offline-first edge AI engine, perpetually free for Catholic organisations and emerging nations"
    />
    <meta property="og:image" content="%BASE_URL%img/logo.svg" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Critical CSS for Instant 20ms First Paint -->
    <style>
      html {
        scrollbar-gutter: stable;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      #root-critical-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
      }
      .critical-bar {
        background: #0f172a;
        color: #f8fafc;
        height: 41px;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        border-bottom: 1px solid #1e293b;
      }
      .critical-bar-inner {
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-size: 0.85rem;
      }
      .critical-nav {
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        height: 54px;
        display: flex;
        align-items: center;
        padding: 0 1rem;
      }
      .critical-nav-inner {
        max-width: 1360px;
        margin: 0 auto;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .critical-brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 700;
        font-size: 1.05rem;
        color: #0f172a;
      }
      .critical-hero {
        max-width: 1100px;
        margin: 0 auto;
        padding: 3.5rem 1.5rem;
        text-align: center;
      }
      .critical-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: 9999px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #1d4ed8;
        font-size: 0.88rem;
        font-weight: 700;
        margin-bottom: 1.25rem;
      }
      .critical-title {
        font-size: 2.85rem;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 1rem 0;
        letter-spacing: -0.025em;
      }
      .critical-sub {
        font-size: 1.2rem;
        color: #475569;
        max-width: 720px;
        margin: 0 auto 2.25rem auto;
        line-height: 1.6;
      }
    </style>

    <!-- Icons & PWA Manifest -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%img/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
  </head>
  <body>
    <div id="root">
      <div id="root-critical-shell">
        <div class="critical-bar">
          <div class="critical-bar-inner">
            <span>🌐</span>
            <strong style="color: #38bdf8;">Universal Translator</strong>
            <span style="font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #334155; color: #fff; font-weight: 700;">ENGLISH ORIGINAL</span>
          </div>
        </div>
        <div class="critical-nav">
          <div class="critical-nav-inner">
            <div class="critical-brand">
              <img src="%BASE_URL%img/logo.svg" alt="Logo" width="28" height="28" style="display: block;" />
              <span>St Joseph's Portal</span>
            </div>
            <div style="display: flex; gap: 1rem; color: #334155; font-size: 0.88rem; font-weight: 600;">
              <span>⚡ Practice</span>
              <span>📖 Lessons</span>
              <span>⭐ Progress</span>
              <span>🌍 Studio</span>
            </div>
          </div>
        </div>
        <div class="critical-hero">
          <div class="critical-pill">✨ UK National Curriculum Aligned • Works Offline</div>
          <h1 class="critical-title">Learn with Confidence at St Joseph's</h1>
          <p class="critical-sub">
            Interactive practice with instant feedback, step-by-step clues, and diagnostic mistake checks.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
