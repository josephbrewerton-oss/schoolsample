<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Neural WebRTC Daemon</title>
</head>
<body>
  <script type="module">
    import { buildPrompt } from './promptStrategies.js';

    console.log('[Worker Daemon] Booting WebRTC Daemon...');
    const bus = new BroadcastChannel('webrtc-neural-signaling');
    let pc = null;
    let activeChannel = null;
    let isConnecting = false;

    async function getAiModelSession() {
      const aiHost = window.ai || self.ai || window.parent?.ai || (typeof ai !== 'undefined' ? ai : null);
      const GlobalLM = window.LanguageModel || window.parent?.LanguageModel;

      // Inside getAiModelSession in static/worker.html
const options = {
  expectedOutputs: [{ type: 'text', languages: ['en'] }]
};

      // 1. Modern Chrome ai.languageModel
      if (aiHost?.languageModel) {
        try {
          if (typeof aiHost.languageModel.capabilities === 'function') {
            const caps = await aiHost.languageModel.capabilities();
            if (caps.available === 'no') return null;
          }
          return await aiHost.languageModel.create({
            expectedOutputs: [{ language: 'en' }]
          });
        } catch {
          try {
            return await aiHost.languageModel.create();
          } catch (err) {
            console.warn('[Worker Daemon] ai.languageModel creation failed:', err);
          }
        }
      }

      // 2. Global window.LanguageModel
      if (GlobalLM?.create) {
        try {
          return await GlobalLM.create({
            expectedOutputs: [{ language: 'en' }]
          });
        } catch {
          try {
            return await GlobalLM.create();
          } catch {}
        }
      }

      // 3. Fallback to assistant namespace
      if (aiHost?.assistant?.create) {
        try {
          return await aiHost.assistant.create();
        } catch {}
      }

      return null;
    }

    async function createOffer() {
      if (isConnecting) return;
      if (activeChannel && activeChannel.readyState === 'open') return;

      isConnecting = true;

      if (pc) {
        pc.close();
      }

      console.log('[Worker Daemon] Creating WebRTC Offer...');
      pc = new RTCPeerConnection();

      const dc = pc.createDataChannel('neural-bus');
      activeChannel = dc;

      dc.onopen = () => {
        isConnecting = false;
        console.log('[Worker Daemon] DataChannel OPEN. Connected to Hypervisor.');
      };

      dc.onclose = () => {
        isConnecting = false;
        console.log('[Worker Daemon] DataChannel CLOSED.');
      };

      dc.onmessage = async (event) => {
        const intent = event.data;
        console.log('[Worker Daemon] Received Intent:', intent);

        let session = null;
        try {
          const prompt = buildPrompt(intent);
          console.log('[Worker Daemon] Prompting on-device model...');
          session = await getAiModelSession();

          if (!session) {
            console.warn('[Worker Daemon] No supported Gemini Nano / Prompt API found.');
            if (dc.readyState === 'open') {
              dc.send('(:route "quiz:mcq" :prompt "Gemini Nano API not detected in this browser." :options (list "OK" "Retry" "Help" "Exit") :answer-key 0)');
              dc.send('__EOF__');
            }
            return;
          }

          const response = await session.prompt(prompt);
          console.log('[Worker Daemon] Model Output:\n', response);

          if (dc.readyState === 'open') {
            dc.send(response);
            dc.send('__EOF__');
          }
        } catch (err) {
          console.error('[Worker Daemon] Generation Error:', err);
          if (dc.readyState === 'open') {
            dc.send('__EOF__');
          }
        } finally {
          if (session && typeof session.destroy === 'function') {
            try {
              session.destroy();
            } catch {}
          }
        }
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          bus.postMessage({ type: 'candidate', candidate: e.candidate.toJSON() });
        }
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        bus.postMessage({ type: 'offer', sdp: pc.localDescription.toJSON() });
      } catch (err) {
        isConnecting = false;
        console.error('[Worker Daemon] Failed to create offer:', err);
      }
    }

    bus.onmessage = async (e) => {
      if (e.data.type === 'peer_ready') {
        createOffer();
      } else if (e.data.type === 'answer' && pc) {
        if (pc.signalingState === 'have-local-offer') {
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(e.data.sdp));
          } catch (err) {
            console.error('[Worker Daemon] setRemoteDescription error:', err);
          }
        }
      } else if (e.data.type === 'candidate' && pc && e.data.candidate) {
        try {
          if (pc.remoteDescription && pc.signalingState !== 'closed') {
            await pc.addIceCandidate(new RTCIceCandidate(e.data.candidate));
          }
        } catch (err) {
          console.error('[Worker Daemon] ICE Candidate Error:', err);
        }
      }
    };

    bus.postMessage({ type: 'daemon_ready' });
    console.log('[Worker Daemon] Listening on BroadcastChannel.');
  </script>
</body>
</html>
